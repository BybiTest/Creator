name: Build & Sign CreatorFlow Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Android (APK, AAB & Bundle Signer .bin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Gradle Wrapper JAR exists
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: Grant Execute Permission
        run: |
          chmod +x gradlew
          chmod +x scripts/bundle-signer.sh || true

      - name: Prepare Release Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'creatorflow123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'creatorflow_key' }}
        run: |
          mkdir -p signing

          if [ ! -f signing/release.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore signing/release.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=CreatorFlow"
          fi

          ls -lh signing/release.keystore

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release Bundle (AAB)
        run: ./gradlew bundleRelease --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Sign Release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'creatorflow123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'creatorflow123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'creatorflow_key' }}
        run: |
          cp app/build/outputs/bundle/release/app-release.aab \
          app/build/outputs/bundle/release/CreatorFlow-release-signed.aab

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore signing/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            app/build/outputs/bundle/release/CreatorFlow-release-signed.aab \
            "$KEY_ALIAS"

          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          cp "$APK_FILE" app/build/outputs/apk/release/CreatorFlow-release-signed.apk

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore signing/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            app/build/outputs/apk/release/CreatorFlow-release-signed.apk \
            "$KEY_ALIAS"
                  - name: Generate Cafe Bazaar Bundle Signer BIN
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'creatorflow123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'creatorflow123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'creatorflow_key' }}
        run: |
          set -e

          mkdir -p signing

          echo "📥 Downloading Cafe Bazaar Bundle Signer..."

          RELEASE_JSON=$(curl -s https://api.github.com/repos/cafebazaar/bundle-signer/releases/latest)

          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | \
            grep browser_download_url | \
            grep -E "\.jar" | \
            head -n 1 | \
            cut -d '"' -f 4)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ Bundle Signer JAR not found"
            exit 1
          fi

          curl -fL "$DOWNLOAD_URL" -o /tmp/bundlesigner.jar

          echo "Checking downloaded signer..."
          file /tmp/bundlesigner.jar

          if ! file /tmp/bundlesigner.jar | grep -qi "Java archive"; then
            echo "❌ Invalid Bundle Signer file"
            exit 1
          fi

          echo "⚡ Generating Bazaar BIN..."

          java -jar /tmp/bundlesigner.jar genbin \
            --bundle app/build/outputs/bundle/release/CreatorFlow-release-signed.aab \
            --bin signing \
            --ks signing/release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS"

          BAZAAR_BIN=$(find signing -maxdepth 1 -name "*.bin" | head -n 1)

          if [ -z "$BAZAAR_BIN" ]; then
            echo "❌ No BIN file generated"
            exit 1
          fi

          cp "$BAZAAR_BIN" signing/bazaar_bundle_signer.bin

          SIZE=$(stat -c%s signing/bazaar_bundle_signer.bin)

          echo "BIN size: $SIZE bytes"

          if [ "$SIZE" -lt 10000 ]; then
            echo "❌ BIN is too small"
            exit 1
          fi

          echo "✅ Bazaar BIN created successfully"
          ls -lh signing/bazaar_bundle_signer.bin


      - name: Upload Universal Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorFlow-Universal-Signed-APK
          path: app/build/outputs/apk/release/CreatorFlow-release-signed.apk
          if-no-files-found: error


      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: CreatorFlow-Signed-Release-AAB
          path: app/build/outputs/bundle/release/CreatorFlow-release-signed.aab
          if-no-files-found: error


      - name: Upload Cafe Bazaar Bundle Signer BIN
        uses: actions/upload-artifact@v4
        with:
          name: CreatorFlow-CafeBazaar-BundleSigner-BIN
          path: signing/bazaar_bundle_signer.bin
          if-no-files-found: error


      - name: Upload Release Keystore
        uses: actions/upload-artifact@v4
        with:
          name: CreatorFlow-Release-Keystore
          path: signing/release.keystore
          if-no-files-found: error


      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorFlow-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
